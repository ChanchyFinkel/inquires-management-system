name: Keep Azure free tier warm

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint (wakes the App Service and the DB)
        run: curl -sf https://inquires-api-4234.azurewebsites.net/health
      - name: Ping client app
        run: curl -sf https://inquiries-client-2994.azurewebsites.net
