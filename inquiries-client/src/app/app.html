<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <div class="shell__brand-mark">
        <mat-icon>check</mat-icon>
      </div>
      <div class="shell__brand-text">
        <span class="shell__brand-name">Inquiries</span>
        <span class="shell__brand-tagline">ניהול פניות</span>
      </div>
    </div>

    <mat-nav-list class="shell__nav">
      <a mat-list-item routerLink="/inquiries" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>פניות</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>לוח בקרה</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
